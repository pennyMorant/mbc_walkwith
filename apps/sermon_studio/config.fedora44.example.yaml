paths:
  work_dir: "./work"
  ffmpeg_bin: "ffmpeg"
  ffprobe_bin: "ffprobe"

audio:
  codec: "aac"
  bitrate: "128k"
  sample_rate: 44100
  channels: 2

transcription:
  # Stable default for Fedora 44 + Ryzen 9950X3D.
  provider: "faster-whisper-cpu"
  model: "medium"
  device: "cpu"
  compute_type: "int8"
  language: "zh"
