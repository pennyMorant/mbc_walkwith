[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sermon-studio"
version = "0.1.0"
description = "Local sermon processing studio for transcript, summary, markdown, and backend upload."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
local = [
  "faster-whisper>=1.2.0",
]
gui = [
  "PySide6>=6.9.0",
]

[project.scripts]
sermon-studio = "sermon_studio.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["sermon_studio*"]
